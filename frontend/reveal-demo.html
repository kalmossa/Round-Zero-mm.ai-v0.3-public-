<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reveal concepts — MM.AI</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Oswald:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a0b;--elev1:#131316;--elev2:#16161b;--border:#26262e;--soft:#1f1f26;
  --text:#f4f4f5;--mut:#9aa0aa;--dim:#6b7080;
  --red:#d20a11;--red2:#ff2730;--blu:#3b82f6;--blu2:#60a5fa;--gold:#f5a623;--grn:#4ade80;
  --fdisp:"Oswald",system-ui,sans-serif;--fmono:"JetBrains Mono",Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--fmono);min-height:100vh;
  display:flex;flex-direction:column;align-items:center;padding:40px 20px;gap:18px}
h1{font-family:var(--fdisp);font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:22px}
.sub{color:var(--dim);font-size:12px;text-align:center;max-width:620px;line-height:1.6}
.wrap{width:100%;max-width:720px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.tab{flex:1;min-width:120px;background:var(--elev2);border:1px solid var(--border);color:var(--mut);
  padding:9px 6px;border-radius:7px;cursor:pointer;font:600 11px/1.1 var(--fmono);
  letter-spacing:.05em;text-transform:uppercase;transition:.18s}
.tab:hover{color:var(--text);border-color:#3a3a44}
.tab.on{background:var(--red);border-color:var(--red);color:#fff}
.replay{background:var(--elev2);border:1px solid var(--border);color:var(--gold);padding:9px 13px;
  border-radius:7px;cursor:pointer;font:600 11px var(--fmono);letter-spacing:.05em;text-transform:uppercase;transition:.18s}
.replay:hover{border-color:var(--gold)}
.stage{position:relative;height:360px;background:#08080b;border:1px solid var(--soft);border-radius:10px;overflow:hidden}
.cap{margin-top:10px;font-size:12px;color:var(--dim);text-align:center;min-height:16px;line-height:1.5}
@keyframes flick{0%,100%{opacity:1}48%{opacity:1}50%{opacity:.78}52%{opacity:1}}
@keyframes scan{0%{transform:translateY(-100%)}100%{transform:translateY(360px)}}
@keyframes spark{0%,100%{opacity:.55;transform:scaleY(.85)}50%{opacity:1;transform:scaleY(1.25)}}
.scanline{position:absolute;left:0;right:0;height:90px;
  background:linear-gradient(180deg,transparent,rgba(74,222,128,.09),transparent);
  animation:scan 2.4s linear infinite;pointer-events:none}
.back{color:var(--mut);font-size:12px;text-decoration:none;margin-top:8px}
.back:hover{color:var(--text)}
</style>
</head>
<body>
  <h1>Matchmaking — concepts de reveal</h1>
  <div class="sub">4 directions pour remplacer le scouter solo actuel. Tout est pensé pour 2 fighters,
    coins rouge/bleu, vraies données Gane vs Lewis. Clique un onglet, « Replay » pour rejouer.</div>
  <div class="wrap">
    <div class="tabs">
      <button class="tab on" data-c="clash">Face-à-face</button>
      <button class="tab" data-c="scouter">Double scouter</button>
      <button class="tab" data-c="tape">Tale of the tape</button>
      <button class="tab" data-c="bar">Probabilité</button>
      <button class="replay" id="replay">↻ Replay</button>
    </div>
    <div class="stage" id="stage"></div>
    <div class="cap" id="cap"></div>
  </div>
  <a class="back" href="matchmaking.html">← retour matchmaking</a>

<script>
(function(){
  var RED='#d20a11',RED2='#ff2730',BLU='#3b82f6',BLU2='#60a5fa',GOLD='#f5a623',GRN='#4ade80',MUT='#9aa0aa',DIM='#6b7080';
  var F1={name:'CIRYL GANE',ab:'CG',rec:'12-2',cc:'FRA',elo:1948,pow:78,reach:81,age:35,win:86,ko:50,form:7.0};
  var F2={name:'DERRICK LEWIS',ab:'DL',rec:'28-12',cc:'USA',elo:1761,pow:62,reach:79,age:40,win:70,ko:82,form:5.0};
  var METHOD='Decision',CONF='Confiance modérée',RND='R5';
  var stage=document.getElementById('stage'),cap=document.getElementById('cap'),timers=[];
  function clr(){timers.forEach(clearTimeout);timers=[];}
  function at(ms,fn){timers.push(setTimeout(fn,ms));}
  function raf2(fn){requestAnimationFrame(function(){requestAnimationFrame(fn);});}
  function count(el,to,dur,dec){dur=dur||1100;dec=dec||0;var s=performance.now();
    function f(n){var p=Math.min((n-s)/dur,1);p=1-Math.pow(1-p,3);el.textContent=(to*p).toFixed(dec);
    if(p<1)requestAnimationFrame(f);else el.textContent=Number(to).toFixed(dec);}requestAnimationFrame(f);}
  function av(ab,col){return '<div style="width:66px;height:66px;border-radius:50%;border:2px solid '+col+
    ';display:flex;align-items:center;justify-content:center;font:700 23px var(--fmono);color:'+col+';background:'+col+'18">'+ab+'</div>';}
  var C={};

  C.clash={cap:'Face-à-face « character select » — les deux coins entrent, le vainqueur s\'embrase.',run:function(){
    stage.innerHTML=
    '<div style="position:absolute;inset:0;display:grid;grid-template-columns:1fr auto 1fr;align-items:center">'+
      '<div id="clR" style="display:flex;flex-direction:column;align-items:center;gap:8px;padding:0 14px;transform:translateX(-130%);transition:transform .6s cubic-bezier(.2,1,.36,1)">'+
        av(F1.ab,RED2)+
        '<div style="font:700 17px var(--fmono);color:#fff;letter-spacing:.04em">'+F1.name+'</div>'+
        '<div style="font-size:11px;color:'+MUT+'">'+F1.rec+' · '+F1.cc+'</div>'+
        '<div style="width:124px;height:6px;background:#1c1c22;border-radius:3px;overflow:hidden;margin-top:2px"><div id="pwR" style="height:100%;width:0;background:'+RED2+';transition:width .9s cubic-bezier(.2,1,.36,1)"></div></div>'+
        '<div id="tagR" style="opacity:0;transform:translateY(8px);transition:.4s;margin-top:4px;font:700 11px var(--fmono);color:'+GOLD+';border:1px solid '+GOLD+'66;background:'+GOLD+'1a;padding:5px 11px;border-radius:5px;letter-spacing:.06em">★ WINNER · 63%</div>'+
      '</div>'+
      '<div id="clVS" style="font:800 42px var(--fmono);color:#fff;text-shadow:0 0 24px '+RED+';transform:scale(0);transition:transform .45s cubic-bezier(.2,1.6,.4,1);padding:0 6px">VS</div>'+
      '<div id="clB" style="display:flex;flex-direction:column;align-items:center;gap:8px;padding:0 14px;transform:translateX(130%);transition:transform .6s cubic-bezier(.2,1,.36,1)">'+
        av(F2.ab,BLU2)+
        '<div style="font:700 17px var(--fmono);color:#fff;letter-spacing:.04em">'+F2.name+'</div>'+
        '<div style="font-size:11px;color:'+MUT+'">'+F2.rec+' · '+F2.cc+'</div>'+
        '<div style="width:124px;height:6px;background:#1c1c22;border-radius:3px;overflow:hidden;margin-top:2px"><div id="pwB" style="height:100%;width:0;background:'+BLU2+';transition:width .9s cubic-bezier(.2,1,.36,1)"></div></div>'+
        '<div style="height:28px"></div>'+
      '</div>'+
    '</div>';
    raf2(function(){document.getElementById('clR').style.transform='translateX(0)';document.getElementById('clB').style.transform='translateX(0)';at(380,function(){document.getElementById('clVS').style.transform='scale(1)';});});
    at(760,function(){document.getElementById('pwR').style.width='78%';document.getElementById('pwB').style.width='62%';});
    at(1700,function(){var r=document.getElementById('clR'),b=document.getElementById('clB'),vs=document.getElementById('clVS');
      r.style.transform='scale(1.07)';r.style.filter='drop-shadow(0 0 18px '+RED+'aa)';
      b.style.transform='scale(.92)';b.style.opacity='.45';
      vs.style.color=GOLD;vs.style.textShadow='0 0 26px '+GOLD;
      var t=document.getElementById('tagR');t.style.opacity='1';t.style.transform='translateY(0)';});
  }};

  C.scouter={cap:'Ton scouter DBZ — mais les DEUX cibles sont scannées en parallèle, puis verdict.',run:function(){
    function panel(s,f){return '<div style="border:1px solid #1f3a26;background:#06120a;border-radius:8px;padding:14px;animation:flick 3s infinite">'+
      '<div style="display:flex;align-items:center;gap:6px;color:'+GRN+';font-size:10px;letter-spacing:.1em;margin-bottom:8px"><span style="width:7px;height:7px;border-radius:50%;background:'+GRN+';display:inline-block"></span>TARGET LOCKED</div>'+
      '<div style="color:#dfffe9;font:700 15px var(--fmono);margin-bottom:2px">'+f.name+'</div>'+
      '<div style="color:#5a8c6a;font-size:10px;margin-bottom:16px">'+f.rec+' · '+f.cc+'</div>'+
      '<div style="color:#5a8c6a;font-size:10px;letter-spacing:.12em;margin-bottom:2px">POWER LEVEL</div>'+
      '<div id="scNum'+s+'" style="color:'+GRN+';font:800 36px var(--fmono);text-shadow:0 0 18px '+GRN+'88;line-height:1">0.0</div>'+
      '<div style="height:5px;background:#10301c;border-radius:3px;overflow:hidden;margin-top:12px"><div id="scBar'+s+'" style="height:100%;width:0;background:'+GRN+';transition:width 1.3s cubic-bezier(.2,1,.36,1)"></div></div>'+
    '</div>';}
    stage.innerHTML='<div class="scanline"></div>'+
    '<div style="position:absolute;inset:0;padding:20px;display:flex;flex-direction:column;gap:14px">'+
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;flex:1">'+panel('R',F1)+panel('B',F2)+'</div>'+
      '<div id="scV" style="opacity:0;transform:translateY(10px);transition:.45s;text-align:center;border:1px solid '+GRN+'55;background:'+GRN+'12;border-radius:7px;padding:11px;color:'+GRN+';font:700 14px var(--fmono);letter-spacing:.04em">⚡ VERDICT — CIRYL GANE ▲ +16 POWER · 63% WIN</div>'+
    '</div>';
    at(250,function(){count(document.getElementById('scNumR'),F1.pow,1300,1);document.getElementById('scBarR').style.width='78%';});
    at(450,function(){count(document.getElementById('scNumB'),F2.pow,1300,1);document.getElementById('scBarB').style.width='62%';});
    at(1800,function(){var v=document.getElementById('scV');v.style.opacity='1';v.style.transform='translateY(0)';});
  }};

  C.tape={cap:'Tale of the tape « broadcast » — chaque stat penche vers le favori, ligne par ligne.',run:function(){
    var stats=[['ELO',F1.elo,F2.elo,'r'],['ALLONGE',F1.reach+'"',F2.reach+'"','r'],['WIN %',F1.win+'%',F2.win+'%','r'],['KO %',F1.ko+'%',F2.ko+'%','b'],['ÂGE',F1.age,F2.age,'r'],['FORME',F1.form.toFixed(1),F2.form.toFixed(1),'r']];
    var rows=stats.map(function(s,i){var rw=s[3]==='r',col=rw?RED2:BLU2,mpos=rw?'14%':'86%';
      return '<div class="tpRow" style="opacity:0;transform:translateY(8px);transition:.4s;display:grid;grid-template-columns:64px 1fr 64px;align-items:center;gap:10px">'+
        '<div style="text-align:right;font:700 14px var(--fmono);color:'+(rw?'#fff':MUT)+'">'+s[1]+'</div>'+
        '<div style="position:relative;height:14px"><div style="position:absolute;top:6px;left:0;right:0;height:2px;background:#1c1c22"></div><div class="tpMk" data-pos="'+mpos+'" style="position:absolute;top:0;left:50%;transform:translateX(-50%);width:12px;height:12px;border-radius:50%;background:'+col+';box-shadow:0 0 10px '+col+';transition:left .55s cubic-bezier(.2,1,.36,1)"></div></div>'+
        '<div style="text-align:left;font:700 14px var(--fmono);color:'+(rw?MUT:'#fff')+'">'+s[2]+'</div>'+
        '<div style="grid-column:1/4;text-align:center;font-size:9px;letter-spacing:.14em;color:'+DIM+';margin-top:-3px">'+s[0]+'</div>'+
      '</div>';}).join('');
    stage.innerHTML='<div style="position:absolute;inset:0;padding:16px 20px;display:flex;flex-direction:column">'+
      '<div style="display:flex;justify-content:space-between;font:700 11px var(--fmono);letter-spacing:.05em;margin-bottom:10px"><span style="color:'+RED2+'">'+F1.name+'</span><span style="color:'+DIM+';letter-spacing:.18em">TALE OF THE TAPE</span><span style="color:'+BLU2+'">'+F2.name+'</span></div>'+
      '<div style="display:flex;flex-direction:column;gap:7px;flex:1;justify-content:center">'+rows+'</div>'+
      '<div id="tpFin" style="opacity:0;transition:.5s;margin-top:8px">'+
        '<div style="display:flex;height:24px;border-radius:5px;overflow:hidden;border:1px solid '+'#26262e'+'"><div id="tpSr" style="width:50%;background:'+RED+';transition:width .8s cubic-bezier(.2,1,.36,1);display:flex;align-items:center;padding-left:8px;font:700 11px var(--fmono);color:#fff">63%</div><div id="tpSb" style="width:50%;background:'+BLU+';transition:width .8s cubic-bezier(.2,1,.36,1);display:flex;align-items:center;justify-content:flex-end;padding-right:8px;font:700 11px var(--fmono);color:#fff">37%</div></div>'+
        '<div style="text-align:center;color:'+GOLD+';font:700 12px var(--fmono);margin-top:8px;letter-spacing:.03em">MM.AI → CIRYL GANE par '+METHOD+'</div>'+
      '</div>'+
    '</div>';
    var rws=[].slice.call(stage.querySelectorAll('.tpRow'));
    rws.forEach(function(r,i){at(180+i*220,function(){r.style.opacity='1';r.style.transform='translateY(0)';var mk=r.querySelector('.tpMk');mk.style.left=mk.getAttribute('data-pos');});});
    at(180+rws.length*220+250,function(){document.getElementById('tpFin').style.opacity='1';document.getElementById('tpSr').style.width='63%';document.getElementById('tpSb').style.width='37%';});
  }};

  C.bar={cap:'Barre de probabilité — les deux énergies se percutent et se stabilisent sur le verdict.',run:function(){
    function pill(c,tx){return '<span style="display:inline-flex;align-items:center;gap:5px;background:#16161b;border:1px solid #26262e;border-radius:20px;padding:6px 13px;font:600 11px var(--fmono);color:'+(c===GOLD?GOLD:'#e4e4e7')+'"><span style="width:6px;height:6px;border-radius:50%;background:'+c+';display:inline-block"></span>'+tx+'</span>';}
    stage.innerHTML='<div style="position:absolute;inset:0;padding:26px;display:flex;flex-direction:column;justify-content:center;gap:20px">'+
      '<div style="display:flex;justify-content:space-between;align-items:flex-end">'+
        '<div><div style="font:700 17px var(--fmono);color:'+RED2+'">'+F1.name+'</div><div style="font-size:11px;color:'+MUT+'">'+F1.rec+' · '+F1.cc+'</div></div>'+
        '<div style="text-align:right"><div style="font:700 17px var(--fmono);color:'+BLU2+'">'+F2.name+'</div><div style="font-size:11px;color:'+MUT+'">'+F2.rec+' · '+F2.cc+'</div></div>'+
      '</div>'+
      '<div style="position:relative;height:48px;border-radius:8px;overflow:hidden;background:#15151a;border:1px solid #26262e">'+
        '<div id="brR" style="position:absolute;left:0;top:0;bottom:0;width:50%;background:'+RED+';transition:width 1.1s cubic-bezier(.2,1,.36,1);display:flex;align-items:center;padding-left:13px;font:800 19px var(--fmono);color:#fff"><span id="brRn">50</span><span style="font-size:11px;margin-left:1px">%</span></div>'+
        '<div id="brB" style="position:absolute;right:0;top:0;bottom:0;width:50%;background:'+BLU+';transition:width 1.1s cubic-bezier(.2,1,.36,1);display:flex;align-items:center;justify-content:flex-end;padding-right:13px;font:800 19px var(--fmono);color:#fff"><span id="brBn">50</span><span style="font-size:11px;margin-left:1px">%</span></div>'+
        '<div id="brSeam" style="position:absolute;top:-4px;bottom:-4px;left:50%;width:3px;background:#fff;box-shadow:0 0 14px #fff;transition:left 1.1s cubic-bezier(.2,1,.36,1);animation:spark 1s infinite"></div>'+
      '</div>'+
      '<div id="brMeth" style="opacity:0;transform:translateY(8px);transition:.5s;display:flex;justify-content:center;gap:8px;flex-wrap:wrap">'+
        pill(GOLD,'CIRYL GANE')+pill(MUT,'Par '+METHOD)+pill(MUT,CONF)+pill(MUT,RND)+
      '</div>'+
    '</div>';
    at(250,function(){document.getElementById('brR').style.width='63%';document.getElementById('brB').style.width='37%';document.getElementById('brSeam').style.left='63%';
      count(document.getElementById('brRn'),63,1100,0);count(document.getElementById('brBn'),37,1100,0);});
    at(1450,function(){var m=document.getElementById('brMeth');m.style.opacity='1';m.style.transform='translateY(0)';});
  }};

  var cur='clash';
  function play(c){cur=c;clr();C[c].run();cap.textContent=C[c].cap;}
  [].slice.call(document.querySelectorAll('.tab')).forEach(function(b){b.addEventListener('click',function(){
    document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('on');});b.classList.add('on');play(b.getAttribute('data-c'));});});
  document.getElementById('replay').addEventListener('click',function(){play(cur);});
  play('clash');
})();
</script>
    <script src="js/demo-banner.js"></script>
</body>
</html>
