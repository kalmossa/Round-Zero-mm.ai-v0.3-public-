<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reset password — MM.AI</title>
    <script>(function(){try{if(localStorage.getItem("mmai-theme")==="light")document.documentElement.setAttribute("data-theme","light");}catch(e){}})();</script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Oswald:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
</head>
<body>
    <header class="navbar">
        <div class="container nav-inner">
            <a class="brand" href="index.html">
                <span class="brand-mark"><span>M</span></span>
                <span class="brand-text">MM<span class="dot">.</span>AI</span>
            </a>
            <nav class="nav-links">
                <a href="index.html">Home</a>
                <a href="rankings.html">Rankings</a>
                <a href="fighters.html">Fighters</a>
                <a href="fighters.html">Fighters</a>
                <a href="matchmaking.html" class="accent-link">Matchmaking</a>
            </nav>
            <div class="nav-search">
                <input type="search" id="nav-search" placeholder="Search a fighter..." autocomplete="off">
            </div>
        </div>
    </header>

    <main class="auth-page">
        <div class="auth-card auth-card-narrow" id="reset-card">
            <div class="auth-icon-wrap">
                <svg class="auth-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
            </div>
            <h1 class="auth-title">New password</h1>
            <p class="auth-sub">Choose a strong password for your account.</p>

            <div id="rp-error-token" class="auth-error" hidden>
                This link is invalid or has expired.
                <br><a href="forgot-password.html" style="color:var(--primary-2);">Request a new one →</a>
            </div>
            <div id="rp-success" class="auth-success" hidden>
                Password updated! <a href="login.html" style="color:var(--primary-2);">Sign in →</a>
            </div>
            <div id="rp-error" class="auth-error" hidden></div>

            <form id="rp-form" class="auth-form" novalidate>
                <div class="auth-field">
                    <label for="rp-password">New password</label>
                    <input type="password" id="rp-password" name="password" minlength="8" required autocomplete="new-password">
                    <span class="auth-hint">Minimum 8 characters</span>
                </div>
                <div class="auth-field">
                    <label for="rp-password2">Confirm password</label>
                    <input type="password" id="rp-password2" name="password2" minlength="8" required autocomplete="new-password">
                </div>
                <button type="submit" id="rp-submit" class="auth-submit">Set new password</button>
            </form>
        </div>
    </main>

    <footer class="footer">
        <div class="container footer-inner">
            <div class="footer-brand">
                <span class="footer-logo">MM<span class="accent">.</span>AI</span>
                <span class="footer-tag">MMA analytics & fight prediction</span>
            </div>
            <div class="footer-meta"><span>© 2026 MM.AI · All rights reserved</span></div>
        </div>
    </footer>

    <script src="js/i18n.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
    <script>
        setupNavSearch();
        (function () {
            const token = new URLSearchParams(location.search).get("token") || "";
            const errToken = document.getElementById("rp-error-token");
            const errBox   = document.getElementById("rp-error");
            const okBox    = document.getElementById("rp-success");
            const form     = document.getElementById("rp-form");
            const btn      = document.getElementById("rp-submit");

            if (!token) {
                errToken.hidden = false;
                form.style.display = "none";
                return;
            }

            form.addEventListener("submit", async (e) => {
                e.preventDefault();
                errBox.hidden = true;
                const password  = document.getElementById("rp-password").value;
                const password2 = document.getElementById("rp-password2").value;
                if (password.length < 8) {
                    errBox.textContent = "Password must be at least 8 characters.";
                    errBox.hidden = false; return;
                }
                if (password !== password2) {
                    errBox.textContent = "Passwords do not match.";
                    errBox.hidden = false; return;
                }
                btn.disabled = true; btn.textContent = "Saving...";
                try {
                    const resp = await fetch("/api/auth/reset-password", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ token, password }),
                    });
                    const body = await resp.json().catch(() => ({}));
                    if (resp.ok) {
                        form.style.display = "none";
                        okBox.hidden = false;
                    } else if (body.error === "invalid_token" || body.error === "token_expired") {
                        form.style.display = "none";
                        errToken.hidden = false;
                    } else {
                        errBox.textContent = body.detail || "Error. Please try again.";
                        errBox.hidden = false;
                    }
                } catch {
                    errBox.textContent = "Network error. Please try again.";
                    errBox.hidden = false;
                } finally {
                    btn.disabled = false; btn.textContent = "Set new password";
                }
            });
        })();
    </script>
    <script src="js/demo-banner.js"></script>
</body>
</html>
