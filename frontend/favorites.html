    <script>
    setupNavSearch();
    applyTranslations();

    (async function renderFavoritesPage() {
        const root = document.getElementById("favorites-root");

        if (!window.MMAIAuth || !window.MMAIAuth.isLoggedIn()) {
            root.innerHTML = `
                <div class="empty" style="padding:48px 0;">
                    <h3>Sign in to see your favorites</h3>
                    <p>Create an account or sign in to follow your favorite fighters.</p>
                    <a href="login.html?next=favorites.html" class="btn btn-primary" style="margin-top:16px;">Sign in</a>
                </div>`;
            return;
        }

        try {
            const resp = await window.MMAIAuth.authFetch("/api/auth/favorites");
            if (!resp.ok) throw new Error("Failed to load favorites");
            const data = await resp.json();
            const favs = data.favorites || [];

            if (!favs.length) {
                root.innerHTML = `
                    <div class="empty" style="padding:48px 0;">
                        <h3>No favorites yet</h3>
                        <p>Browse fighters and click ☆ to add them here.</p>
                        <a href="fighters.html" class="btn btn-ghost" style="margin-top:16px;">Browse fighters</a>
                    </div>`;
                return;
            }

            root.innerHTML = `<div class="fav-list-container favorites-page-list" id="fav-page-list">${favs.map(f => buildFavRow(f)).join("")}</div>`;

            root.querySelectorAll(".fav-remove-btn").forEach(btn => {
                btn.addEventListener("click", async (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    const fid = btn.dataset.fid;
                    btn.disabled = true;
                    try {
                        const r = await window.MMAIAuth.authFetch(`/api/auth/favorites/${fid}`, { method: "DELETE" });
                        if (r.ok) {
                            const row = btn.closest(".fav-list-row");
                            if (row) { row.style.opacity = "0"; row.style.transition = "opacity 0.2s"; setTimeout(() => row.remove(), 220); }
                        }
                    } catch {}
                    btn.disabled = false;
                });
            });

        } catch (e) {
            root.innerHTML = `<div class="error-box">${e.message}</div>`;
        }
    })();

    function buildFavRow(f) {
        const photo = f.photo_thumbnail_url;
        const initial = escHtml((f.name || "?")[0].toUpperCase());
        // Pas de onerror innerHTML (casse le HTML) — on masque juste l'img si elle plante
        const photoContent = photo
            ? `<img src="${escHtml(photo)}" alt="" loading="lazy" onerror="this.style.display='none'">`
            : `<span class="fav-list-initial">${initial}</span>`;
        const w = f.record_total_wins || 0, l = f.record_total_losses || 0;
        const flagHTML = typeof nationalityToFlagHTML === "function" ? nationalityToFlagHTML(f.nationality || "") : "";
        const wc = escHtml((typeof formatWeightClassLong === "function"
            ? formatWeightClassLong(f.weight_class_current, f.gender)
            : (f.weight_class_current || "")) || "");
        return `
            <a href="fighter.html?id=${f.id}" class="fav-list-row">
                <div class="fav-list-photo">${photoContent}</div>
                <div class="fav-list-info">
                    <div class="fav-list-name-row">
                        <span class="fav-list-name">${escHtml(f.name)}</span>
                        ${flagHTML ? `<span class="fav-flag-inline">${flagHTML}</span>` : ""}
                    </div>
                    <div class="fav-list-cat">${wc}</div>
                </div>
                <div class="fav-list-record">${w}-${l}</div>
                <button type="button" class="fav-remove-btn" data-fid="${f.id}" title="Remove from favorites" aria-label="Remove from favorites">✕</button>
            </a>`;
    }

    function escHtml(s) {
        return String(s || "").replace(/[<>&"']/g, c => ({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;","'":"&#39;"}[c]));
    }
    </script>
