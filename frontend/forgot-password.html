<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Forgot password — MM.AI</title>
    <script>(function(){try{if(localStorage.getItem("mmai-theme")==="light")document.documentElement.setAttribute("data-theme","light");}catch(e){}})();</script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Oswald:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
</head>
<body>
    <header class="navbar">
        <div class="container nav-inner">
            <a class="brand" href="index.html">
                <span class="brand-mark"><span>M</span></span>
                <span class="brand-text">MM<span class="dot">.</span>AI</span>
            </a>
            <nav class="nav-links">
                <a href="index.html">Home</a>
                <a href="rankings.html">Rankings</a>
                <a href="fighters.html">Fighters</a>
                <a href="divisions.html">Divisions</a>
                <a href="matchmaking.html" class="accent-link">Matchmaking</a>
            </nav>
            <div class="nav-search">
                <input type="search" id="nav-search" placeholder="Search a fighter..." autocomplete="off">
            </div>
        </div>
    </header>

    <main class="auth-page">
        <div class="auth-card auth-card-narrow">
            <div class="auth-icon-wrap">
                <svg class="auth-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
            </div>
            <h1 class="auth-title">Forgot password</h1>
            <p class="auth-sub">Enter your email and we'll send you a reset link.</p>

            <div id="fp-success" class="auth-success" hidden>
                Check your inbox (and terminal if testing locally) — a reset link has been sent.
            </div>
            <div id="fp-error" class="auth-error" hidden></div>

            <form id="fp-form" class="auth-form" novalidate>
                <div class="auth-field">
                    <label for="fp-email">Email</label>
                    <input type="email" id="fp-email" name="email" required autofocus autocomplete="email">
                </div>
                <button type="submit" id="fp-submit" class="auth-submit">Send reset link</button>
            </form>

            <p class="auth-switch" style="margin-top:16px;">
                <a href="login.html">← Back to sign in</a>
            </p>
        </div>
    </main>

    <footer class="footer">
        <div class="container footer-inner">
            <div class="footer-brand">
                <span class="footer-logo">MM<span class="accent">.</span>AI</span>
                <span class="footer-tag">MMA analytics & fight prediction</span>
            </div>
            <div class="footer-social">
                <a href="https://github.com/kalmossa" target="_blank" rel="noopener noreferrer" aria-label="GitHub" class="footer-icon">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.58.1.79-.25.79-.56v-2c-3.2.7-3.87-1.36-3.87-1.36-.52-1.32-1.27-1.67-1.27-1.67-1.04-.71.08-.7.08-.7 1.15.08 1.76 1.18 1.76 1.18 1.02 1.75 2.68 1.25 3.34.96.1-.74.4-1.25.73-1.54-2.56-.29-5.25-1.28-5.25-5.7 0-1.26.45-2.29 1.18-3.1-.12-.29-.51-1.46.11-3.04 0 0 .96-.31 3.15 1.18.91-.25 1.89-.38 2.86-.38s1.95.13 2.86.38c2.18-1.49 3.14-1.18 3.14-1.18.62 1.58.23 2.75.11 3.04.74.81 1.18 1.84 1.18 3.1 0 4.43-2.69 5.41-5.25 5.69.41.36.78 1.07.78 2.16v3.2c0 .31.21.67.8.56C20.21 21.39 23.5 17.08 23.5 12 23.5 5.65 18.35.5 12 .5z"/></svg>
                </a>
            </div>
            <div class="footer-meta"><span>© 2026 MM.AI · All rights reserved</span></div>
        </div>
    </footer>

    <script src="js/i18n.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
    <script>
        setupNavSearch();
        document.getElementById("fp-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            const errBox = document.getElementById("fp-error");
            const okBox  = document.getElementById("fp-success");
            const btn    = document.getElementById("fp-submit");
            const email  = document.getElementById("fp-email").value.trim();
            errBox.hidden = true; okBox.hidden = true;
            if (!email) { errBox.textContent = "Please enter your email."; errBox.hidden = false; return; }
            btn.disabled = true; btn.textContent = "Sending...";
            try {
                await fetch("/api/auth/forgot-password", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email }),
                });
                okBox.hidden = false;
                document.getElementById("fp-form").style.display = "none";
            } catch {
                errBox.textContent = "Network error. Please try again.";
                errBox.hidden = false;
            } finally {
                btn.disabled = false; btn.textContent = "Send reset link";
            }
        });
    </script>
    <script src="js/demo-banner.js"></script>
</body>
</html>
