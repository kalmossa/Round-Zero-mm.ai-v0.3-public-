    <script>
        (function () {
            const params = new URLSearchParams(location.search);
            const status = (params.get("status") || "ok").toLowerCase();
            const card = document.getElementById("verified-card");
            function tt(key, fallback) { return (typeof t === "function") ? t(key) : fallback; }

            const ICON_OK = `<svg class="auth-icon ok" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                <polyline points="22 4 12 14.01 9 11.01"></polyline></svg>`;
            const ICON_ERR = `<svg class="auth-icon err" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="8" x2="12" y2="12"></line>
                <line x1="12" y1="16" x2="12.01" y2="16"></line></svg>`;

            let icon, titleKey, subKey, redirect, btnLabel = "auth.go_login", btnHref = "login.html?verified=1";
            switch (status) {
                case "ok":
                    icon = ICON_OK;
                    titleKey = "auth.verified_ok_title"; subKey = "auth.verified_ok_sub";
                    redirect = true;
                    break;
                case "already":
                    icon = ICON_OK;
                    titleKey = "auth.verified_already_title"; subKey = "auth.verified_already_sub";
                    btnHref = "login.html";
                    break;
                case "expired":
                    icon = ICON_ERR;
                    titleKey = "auth.verified_expired_title"; subKey = "auth.verified_expired_sub";
                    btnHref = "login.html";
                    break;
                default: // invalid_token, missing_token
                    icon = ICON_ERR;
                    titleKey = "auth.verified_invalid_title"; subKey = "auth.verified_invalid_sub";
                    btnHref = "login.html";
            }

            card.innerHTML = `
                <div class="auth-icon-wrap">${icon}</div>
                <h1 class="auth-title" data-i18n="${titleKey}">Email verified</h1>
                <p class="auth-sub" data-i18n="${subKey}">Your account is now active.</p>
                <a href="${btnHref}" class="auth-submit" data-i18n="${btnLabel}">Go to sign in</a>
            `;

            setupNavSearch();
            applyTranslations();

            // Auto-redirect vers le login apres 2s en cas de success
            if (redirect) {
                setTimeout(() => { location.href = "login.html?verified=1"; }, 2000);
            }
        })();
    </script>
